services:
  db:
    image: postgres:latest
    ports:
      - 5432:5432
    env_file: ./.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

  rest:
    depends_on:
      - db
    ports:
      - 8080:8080
    build:
      context: .
      dockerfile: Dockerfile

